# Builds the Markets by MP desktop app for macOS (Apple silicon and Intel) and Windows, and attaches the
# installers to a GitHub Release. Runs when a tag like v0.2.0 is pushed, or by hand from the Actions tab.
name: Desktop app
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'desktop-latest' }}
          releaseName: Markets by MP ${{ github.ref_type == 'tag' && github.ref_name || '(latest build)' }}
          releaseBody: |
            Download for your computer below:
            - **Mac (Apple silicon, M1 and later):** the `aarch64.dmg` file
            - **Mac (Intel):** the `x64.dmg` file
            - **Windows:** the `x64-setup.exe` file

            The app isn't code-signed yet, so the first launch needs one extra step. See the README.
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
